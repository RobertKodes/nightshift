<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" shape-rendering="crispEdges" role="img" aria-label="NIGHTSHIFT pixel frog operator">
  <!-- antenna -->
  <g fill="#57d97b">
    <rect x="11" y="0" width="2" height="1"/>
    <rect x="12" y="1" width="1" height="2"/>
  </g>
  <rect x="11" y="0" width="1" height="1" fill="#b8ff3d"/>
  <!-- eye bumps -->
  <g fill="#b8ff3d">
    <rect x="3" y="3" width="6" height="7"/>
    <rect x="15" y="3" width="6" height="7"/>
    <rect x="2" y="8" width="20" height="5"/>
    <rect x="3" y="13" width="18" height="6"/>
    <rect x="5" y="19" width="14" height="2"/>
    <rect x="2" y="21" width="4" height="2"/>
    <rect x="18" y="21" width="4" height="2"/>
  </g>
  <!-- pupils, drawn as a visor -->
  <g fill="#050706">
    <rect x="4" y="4" width="4" height="4"/>
    <rect x="16" y="4" width="4" height="4"/>
    <rect x="3" y="10" width="18" height="2"/>
    <rect x="6" y="15" width="12" height="1"/>
    <rect x="7" y="16" width="2" height="1"/>
    <rect x="15" y="16" width="2" height="1"/>
  </g>
  <g fill="#57d97b">
    <rect x="4" y="9" width="2" height="1"/>
    <rect x="18" y="9" width="2" height="1"/>
    <rect x="4" y="15" width="1" height="4"/>
    <rect x="19" y="15" width="1" height="4"/>
    <rect x="9" y="18" width="6" height="1"/>
  </g>
  <!-- screen glare -->
  <g fill="#eaffc9" opacity=".85">
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="17" y="5" width="1" height="1"/>
  </g>
</svg>
