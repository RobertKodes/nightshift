# Builds the NIGHTSHIFT image on every push to master and publishes it to GitHub's registry,
# so a small server only pulls it instead of building (pnpm install + vite needs more RAM than a t3.small has spare).
name: image
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
      - name: Check engine types
        run: pnpm --filter @nightshift/engine typecheck
      - name: Check web types
        run: pnpm --filter @nightshift/web typecheck
      - name: Test engine
        run: pnpm --filter @nightshift/engine test -- --maxWorkers=2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/robertkodes/nightshift:latest
            ghcr.io/robertkodes/nightshift:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
