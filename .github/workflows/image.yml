# Builds the NIGHTSHIFT image on every push to master and publishes it to GitHub's registry,
# so a small server only pulls it instead of building (pnpm install + vite needs more RAM than a t3.small has spare).
name: image
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/robertkodes/nightshift:latest
            ghcr.io/robertkodes/nightshift:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
