plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'tech.getnightshift.devicekey'
version = '0.1.0'

android {
  namespace "tech.getnightshift.devicekey"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
